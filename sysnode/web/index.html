<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysNode - Instalar</title>
    <style>
        :root {
            --bg: #0f1115;
            --surface: #1e2128;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 14px 20px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Colores sutiles para los botones */
        .btn-android { background-color: rgba(61, 220, 132, 0.15); border-color: rgba(61, 220, 132, 0.3); color: #81f4a9; }
        .btn-android:hover { background-color: rgba(61, 220, 132, 0.25); border-color: rgba(61, 220, 132, 0.5); color: #a3f7c1; }

        .btn-windows { background-color: rgba(0, 120, 215, 0.15); border-color: rgba(0, 120, 215, 0.3); color: #7cbcf2; }
        .btn-windows:hover { background-color: rgba(0, 120, 215, 0.25); border-color: rgba(0, 120, 215, 0.5); color: #a4cff5; }

        .btn-linux { background-color: rgba(245, 169, 0, 0.15); border-color: rgba(245, 169, 0, 0.3); color: #fad170; }
        .btn-linux:hover { background-color: rgba(245, 169, 0, 0.25); border-color: rgba(245, 169, 0, 0.5); color: #fce2a1; }
        
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SysNode</h1>
        <p style="margin-bottom: 20px;">Comunicación P2P local, rápida y segura.</p>

        <div class="btn-group">
            <a href="https://github.com/Jorcase/SysNode/releases/latest/download/sysnode.apk" class="btn btn-android" target="_blank" rel="noopener noreferrer">Android (.apk)</a>
            <a href="https://github.com/Jorcase/SysNode/releases/latest/download/sysnode-installer.exe" class="btn btn-windows" target="_blank" rel="noopener noreferrer">Windows (.exe)</a>
            <a href="https://github.com/Jorcase/SysNode/releases/latest/download/sysnode" class="btn btn-linux" target="_blank" rel="noopener noreferrer">Linux (Ejecutable)</a>
        </div>
        
        <div class="info-box" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-top: 25px; text-align: left; font-size: 13px; color: var(--text-muted);">
            Descargá el instalador para tu plataforma y conectate automáticamente con los dispositivos de esta red. No requiere internet.
        </div>

        <div class="footer">SysNode P2P LAN</div>
    </div>
</body>
</html>
